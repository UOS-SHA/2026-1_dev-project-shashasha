spring.application.name=crew-server

# ── DB 접속 정보 ──────────────────────────────────────────────
# ${ENV_NAME:기본값} 문법: 환경변수가 있으면 그 값, 없으면 뒤의 기본값 사용.
# 로컬에서는 기본값으로 바로 동작하고, 배포 서버에서는 환경변수로 덮어씀.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crew}
spring.datasource.username=${DB_USERNAME:crew}
spring.datasource.password=${DB_PASSWORD:crewpass}

# ── JPA / Hibernate ──────────────────────────────────────────
# ddl-auto=update : 엔티티(자바 클래스) 모양에 맞춰 테이블을 자동 생성/수정.
#   개발 초기엔 편함. (운영에선 validate 또는 마이그레이션 도구로 바꿈)
spring.jpa.hibernate.ddl-auto=update
# 실행 중 어떤 SQL이 나가는지 콘솔에 보여줌 (공부할 때 큰 도움)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── 서버 포트 ─────────────────────────────────────────────────
# 로컬은 8080. 클라우드 배포(Render/Railway 등)는 플랫폼이 주는 PORT 환경변수를 씀.
server.port=${PORT:8080}

# ── JWT(로그인 토큰) 설정 ─────────────────────────────────────
# secret: 토큰에 서명할 때 쓰는 비밀 열쇠. HS256은 최소 32바이트(256비트) 이상이어야 함.
#
#   여기에 기본값을 적어두면 안 된다. 저장소가 공개되는 순간 그 값을 아는 누구나
#   "나는 id=1 사용자다" 라는 토큰을 직접 서명해 만들 수 있고, 서버는 그것을 정상 로그인으로 받는다.
#   (실제로 예전에는 dev-only-... 로 시작하는 기본값이 커밋되어 있었다)
#
#   비워두면 JwtTokenProvider 가 실행할 때마다 무작위 키를 만들어 쓴다.
#   → 로컬 개발은 설정 없이 그대로 되고, 대신 서버를 재시작하면 기존 토큰은 모두 무효가 된다.
#   → 운영 배포에서는 반드시 JWT_SECRET 환경변수에 32자 이상의 무작위 문자열을 넣을 것.
#      (생성 예: openssl rand -base64 48)
# expiration: 토큰 유효시간(밀리초). 기본 7일(1000*60*60*24*7).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:604800000}
